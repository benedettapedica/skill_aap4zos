---
- name: Add a specific line in a DATA_SET
  hosts: zos_host
  gather_facts: false
  
  # Utilizziamo le tue variabili d'ambiente originali
  environment: "{{ environment_vars }}"

  tasks:
    - name: Debug Inputs
      ansible.builtin.debug:
        msg: "Operazione: {{ operation }}, Dataset: {{ src }}, Regex: {{ regex }}"

    - name: Insert before line in file
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ src }}"
        insertbefore: "{{ regex }}"
        line: "{{ line }}"
        force: true 
      # La correzione: aggiungiamo /python3.11 al PYTHONPATH solo per questo task
      environment: "{{ environment_vars | combine({'PYTHONPATH': environment_vars.ZOAU_HOME + '/lib/python3.11:' + environment_vars.get('PYTHONPATH', '')}) }}"
      when: operation == "INSERT_BEFORE"
      register: inline_change_before
      failed_when: 
        - inline_change.rc is defined
        - inline_change.rc != 0
        - '"changed" not in inline_change.stdout'

    - name: Insert after line in file
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ src }}"
        insertafter: "{{ regex }}"
        line: "{{ line }}"
        force: true 
      # Applichiamo la stessa correzione anche qui
      environment: "{{ environment_vars | combine({'PYTHONPATH': environment_vars.ZOAU_HOME + '/lib/python3.11:' + environment_vars.get('PYTHONPATH', '')}) }}"
      when: operation == "INSERT_AFTER"
      register: inline_change_after
      failed_when: 
        - inline_change.rc is defined
        - inline_change.rc != 0
        - '"changed" not in inline_change.stdout'

    - name: Consolidate Results
      ansible.builtin.set_fact:
        inline_results: "{{ inline_change_before if operation == 'INSERT_BEFORE' else inline_change_after }}"

    - name: Print results
      ansible.builtin.debug:
        var: inline_results
