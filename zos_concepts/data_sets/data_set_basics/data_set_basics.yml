# This sample playbook demonstrates basic data set operations using modules
# included in the Red Hat Ansible Certified  Content for IBM Z core collection.
#
# Usage:
#  ansible-playbook -i <inventory> <playbook>
#
# Example:
#  ansible-playbook -i inventories data_set_basics.yml
#  ansible-playbook -i inventories data_set_basics.yml -v
#
#  Additional facts for this playbook can be configured to override the defaults
#  by reviewing the "Fact setting" section of this playbook, for example,
#  `data_set_name` and `system_name`.
#
# Requirements:
#   IBM z/OS core collection 1.2.0 or later
#
# Configure:
#   tgt_tmp_dir - this is the USS directory on the target which will be written
#                 to for this example.
#
# Optional:
#   data_set_name - this is the data set name that will be created during
#                   execution of this sample.
#   pds_name - this is the pds name that will be used during execution of this
#              sample.
#   system_name - this is the system name that will be used during this example,
#                 determined by executing `uname -n` on the target.
###############################################################################
---
- hosts: zos_host
  collections:
    - ibm.ibm_zos_core
  gather_facts: false
  vars:
    parmlib_dataset: "{{ parmlib_dataset | default('SYS1.PARMLIB') }}"
    parmlib_member: "{{ parmlib_member | default('PROG00') }}"
    apf_entry: "{{ apf_entry | default('') }}"
    operation: "{{ operation | default('add') }}"
  environment: "{{ environment_vars }}"

  tasks:
    - name: Create backup of PARMLIB member
      zos_copy:
        src: "{{ parmlib_dataset }}({{ parmlib_member }})"
        dest: "/tmp/{{ parmlib_member }}.backup"
        remote_src: true
      register: backup_result

    - name: Read current PARMLIB content
      zos_fetch:
        src: "{{ parmlib_dataset }}({{ parmlib_member }})"
        dest: "/tmp/{{ parmlib_member }}.txt"
        flat: true
      register: fetch_result

    - name: Add APF entry to PARMLIB
      zos_lineinfile:
        src: "{{ parmlib_dataset }}({{ parmlib_member }})"
        line: "{{ apf_entry }}"
        state: present
      when: operation == 'add'
      register: add_result

    - name: Remove APF entry from PARMLIB
      zos_lineinfile:
        src: "{{ parmlib_dataset }}({{ parmlib_member }})"
        regexp: "{{ apf_entry }}"
        state: absent
      when: operation == 'delete'
      register: delete_result

    - name: Display result
      debug:
        msg:
          - "Operation: {{ operation }}"
          - "PARMLIB: {{ parmlib_dataset }}({{ parmlib_member }})"
          - "Entry: {{ apf_entry }}"
          - "Backup: /tmp/{{ parmlib_member }}.backup"
          - "Result: {{ add_result if operation == 'add' else delete_result }}"
