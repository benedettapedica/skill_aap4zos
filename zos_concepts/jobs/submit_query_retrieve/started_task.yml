---
- name: Manage z/OS Started Tasks
  hosts: zos_host
  gather_facts: false
  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Query started tasks
      ibm.ibm_zos_core.zos_operator_action_query:
        system: "*"
        job_name: "{{ task_name | default('*') }}"
      register: stc_query_result
      when: (action | default('query')) == 'query'

    - name: Display started tasks (query)
      ansible.builtin.debug:
        msg: |
          ========================================
          z/OS Started Tasks Query Results
          ========================================
          Total started tasks found: {{ stc_query_result.jobs | length }}
          
          {% for job in stc_query_result.jobs %}
          ---
          Task Name: {{ job.job_name }}
          Job ID: {{ job.job_id }}
          Owner: {{ job.owner | default('N/A') }}
          Status: {{ job.ret_code.msg | default('ACTIVE') }}
          {% if job.ret_code.code is defined %}
          Return Code: {{ job.ret_code.code }}
          {% endif %}
          Class: {{ job.class | default('STC') }}
          {% if job.subsystem is defined %}
          Subsystem: {{ job.subsystem }}
          {% endif %}
          {% if job.program_name is defined %}
          Program: {{ job.program_name }}
          {% endif %}
          {% endfor %}
          ========================================
      when: (action | default('query')) == 'query' and stc_query_result.jobs is defined

    - name: Start started task
      ibm.ibm_zos_core.zos_operator:
        cmd: "S {{ task_name }}{% if parms is defined %},{{ parms }}{% endif %}"
        wait: "{{ wait | default(true) }}"
        wait_time_s: "{{ timeout | default(60) }}"
      register: stc_start_result
      when: (action | default('query')) == 'start'

    - name: Display start result
      ansible.builtin.debug:
        msg: |
          ========================================
          Started Task Start Result
          ========================================
          Task Name: {{ task_name }}
          Command: S {{ task_name }}{% if parms is defined %},{{ parms }}{% endif %}
          
          Output:
          {{ stc_start_result.content | join('\n') }}
          ========================================
      when: (action | default('query')) == 'start'

    - name: Stop started task
      ibm.ibm_zos_core.zos_operator:
        cmd: "P {{ task_name }}"
        wait: "{{ wait | default(true) }}"
        wait_time_s: "{{ timeout | default(60) }}"
      register: stc_stop_result
      when: (action | default('query')) == 'stop'

    - name: Display stop result
      ansible.builtin.debug:
        msg: |
          ========================================
          Started Task Stop Result
          ========================================
          Task Name: {{ task_name }}
          Command: P {{ task_name }}
          
          Output:
          {{ stc_stop_result.content | join('\n') }}
          ========================================
      when: (action | default('query')) == 'stop'

    - name: Restart started task (stop first)
      ibm.ibm_zos_core.zos_operator:
        cmd: "P {{ task_name }}"
        wait: true
        wait_time_s: 30
      register: stc_restart_stop
      when: (action | default('query')) == 'restart'

    - name: Wait for task to stop
      ansible.builtin.pause:
        seconds: 5
      when: (action | default('query')) == 'restart'

    - name: Restart started task (start again)
      ibm.ibm_zos_core.zos_operator:
        cmd: "S {{ task_name }}{% if parms is defined %},{{ parms }}{% endif %}"
        wait: "{{ wait | default(true) }}"
        wait_time_s: "{{ timeout | default(60) }}"
      register: stc_restart_start
      when: (action | default('query')) == 'restart'

    - name: Display restart result
      ansible.builtin.debug:
        msg: |
          ========================================
          Started Task Restart Result
          ========================================
          Task Name: {{ task_name }}
          
          Stop Output:
          {{ stc_restart_stop.content | join('\n') }}
          
          Start Output:
          {{ stc_restart_start.content | join('\n') }}
          ========================================
      when: (action | default('query')) == 'restart'

    - name: Save results to file
      ansible.builtin.copy:
        content: |
          {% if (action | default('query')) == 'query' %}
          {{ stc_query_result | to_nice_json }}
          {% elif (action | default('query')) == 'start' %}
          {{ stc_start_result | to_nice_json }}
          {% elif (action | default('query')) == 'stop' %}
          {{ stc_stop_result | to_nice_json }}
          {% elif (action | default('query')) == 'restart' %}
          {{ {'stop': stc_restart_stop, 'start': stc_restart_start} | to_nice_json }}
          {% endif %}
        dest: "/tmp/stc_{{ action | default('query') }}_{{ task_name | default('all') }}_{{ ansible_date_time.epoch }}.json"
      delegate_to: localhost

    - name: Summary
      ansible.builtin.debug:
        msg: |
          {% if (action | default('query')) == 'query' %}
          Query completed. Found {{ stc_query_result.jobs | length }} started task(s).
          {% elif (action | default('query')) == 'start' %}
          Started task {{ task_name }} initiated successfully.
          {% elif (action | default('query')) == 'stop' %}
          Started task {{ task_name }} stop command issued.
          {% elif (action | default('query')) == 'restart' %}
          Started task {{ task_name }} restarted successfully.
          {% endif %}

