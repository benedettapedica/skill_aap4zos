---
- name: Retrieve z/OS Job Output
  hosts: zos_host
  collections:
    - ibm.ibm_zos_core
  gather_facts: false
  environment: "{{ environment_vars }}"
  
  tasks:
    - name: Debug input parameters
      debug:
        msg:
          - "job_id: {{ job_id }}"
          - "job_name: {{ job_name | default('NOT PROVIDED') }}"
    
    - name: Retrieve job output by job_id and job_name
      ibm.ibm_zos_core.zos_job_output:
        job_id: "{{ job_id }}"
        job_name: "{{ job_name }}"
      register: job_output
      when: job_name is defined and job_name != ''
      
    - name: Retrieve job output by job_id only
      ibm.ibm_zos_core.zos_job_output:
        job_id: "{{ job_id }}"
      register: job_output
      when: job_name is not defined or job_name == ''
      
    - name: Save output to file
      copy:
        content: "{{ job_output | to_nice_json }}"
        dest: "/tmp/job_output_{{ job_id }}_{{ lookup('pipe', 'date +%s') }}.json"
      delegate_to: localhost
      when: job_output is defined
      
    - name: Display z/OS Job Output
      debug:
        var: job_output
      when: job_output is defined
      
    - name: Summary
      debug:
        msg: "Job output retrieved successfully for Job ID: {{ job_id }}"
      when: job_output is defined

