---
- name: Retrieve z/OS Job Output
  hosts: zos_host
  collections:
    - ibm.ibm_zos_core
  gather_facts: false
  environment: "{{ environment_vars }}"
  
  tasks:
    # Debug input parameters
    - name: Debug input parameters
      debug:
        msg:
          job_name: "{{ job_name if (job_name is defined and job_name != '' and job_name != '*') else omit }}"
          owner: "{{ owner if (owner is defined and owner != '' and owner != '*') else omit }}"
          job_id: "{{ job_id if (job_id is defined and job_id != '' and job_id != '*') else omit }}"
    
    # Check if wildcards are used (*, ?)
    - name: Set wildcard flag
      set_fact:
        has_wildcards: "{{ (job_name is defined and job_name != '' and ('*' in job_name or '?' in job_name)) or (job_id is defined and job_id != '' and ('*' in job_id or '?' in job_id)) }}"
    
    # Path 1: Wildcards detected - Query first, then get output for each job
    - name: Query jobs when wildcards are used
      ibm.ibm_zos_core.zos_job_query:
        job_name: "{{ job_name if job_name is defined and job_name != '' else '*' }}"
        owner: "{{ owner if owner is defined and owner != '' else '*' }}"
        job_id: "{{ job_id | default(omit) }}"
      register: job_list
      when: has_wildcards | bool
      
    - name: Retrieve output for each job found
      ibm.ibm_zos_core.zos_job_output:
        job_name: "{{ item.job_name }}"
        job_id: "{{ item.job_id }}"
      loop: "{{ job_list.jobs }}"
      register: multiple_outputs
      when: has_wildcards | bool and job_list.jobs | length > 0
      
    - name: Save multiple outputs to file
      copy:
        content: "{{ multiple_outputs | to_nice_json }}"
        dest: "/tmp/job_outputs_{{ lookup('pipe', 'date +%s') }}.json"
      delegate_to: localhost
      when: has_wildcards | bool and multiple_outputs is defined
      
    - name: Summary for multiple jobs
      debug:
        msg: "Retrieved output for {{ multiple_outputs.results | length }} jobs"
      when: has_wildcards | bool and multiple_outputs is defined
    
    # Path 2: No wildcards - Direct output retrieval for specific job
    - name: Set output query parameters
      ansible.builtin.set_fact:
        output_params:
          job_name: "{{ job_name if (job_name is defined and job_name != '') else omit }}"
          job_id: "{{ job_id if (job_id is defined and job_id != '') else omit }}"
          owner: "{{ owner if (owner is defined and owner != '') else omit }}"
    
    - name: Retrieve job output
      ibm.ibm_zos_core.zos_job_output: "{{ output_params }}"
      register: single_output
      when: not (has_wildcards | bool)
      
    - name: Save single output to file
      copy:
        content: "{{ single_output | to_nice_json }}"
        dest: "/tmp/job_output_{{ lookup('pipe', 'date +%s') }}.json"
      delegate_to: localhost
      when: not (has_wildcards | bool) and single_output is defined
      
    - name: Display z/OS Job Output
      debug:
        var: single_output
      when: not (has_wildcards | bool) and single_output is defined
    
    - name: Summary for single job
      debug:
        msg: "Job output retrieved successfully for {{ single_output.jobs[0].job_name if single_output.jobs is defined and single_output.jobs | length > 0 else 'N/A' }}"
      when: not (has_wildcards | bool) and single_output is defined

