---
- name: Retrieve z/OS Job Output
  hosts: zos_host
  gather_facts: false
  collections:
    - ibm.ibm_zos_core

  tasks:
    - name: Validate input parameters
      ansible.builtin.assert:
        that:
          - job_name is defined or job_id is defined
        fail_msg: "Either job_name or job_id must be specified"

    - name: Retrieve job output
      ibm.ibm_zos_core.zos_job_output:
        job_name: "{{ job_name | default(omit) }}"
        job_id: "{{ job_id | default(omit) }}"
        owner: "{{ owner | default(omit) }}"
        ddname: "{{ ddname | default(omit) }}"
      register: job_output_result

    - name: Display job information
      ansible.builtin.debug:
        msg: |
          ========================================
          z/OS Job Output
          ========================================
          Job Name: {{ job_output_result.jobs[0].job_name }}
          Job ID: {{ job_output_result.jobs[0].job_id }}
          Owner: {{ job_output_result.jobs[0].owner }}
          Return Code: {{ job_output_result.jobs[0].ret_code.code | default('N/A') }}
          Status: {{ job_output_result.jobs[0].ret_code.msg | default('N/A') }}
          ========================================

    - name: Display DD output
      ansible.builtin.debug:
        msg: |
          
          ========================================
          DD Name: {{ item.ddname }}
          Step Name: {{ item.stepname | default('N/A') }}
          Proc Step: {{ item.procstep | default('N/A') }}
          Record Count: {{ item.record_count | default(0) }}
          ========================================
          
          {{ item.content | join('\n') }}
          
      loop: "{{ job_output_result.jobs[0].ddnames }}"
      when: 
        - job_output_result.jobs is defined
        - job_output_result.jobs | length > 0
        - job_output_result.jobs[0].ddnames is defined

    - name: Save complete output to file
      ansible.builtin.copy:
        content: "{{ job_output_result | to_nice_json }}"
        dest: "/tmp/job_output_{{ job_output_result.jobs[0].job_name }}_{{ job_output_result.jobs[0].job_id }}.json"
      delegate_to: localhost
      when: 
        - job_output_result.jobs is defined
        - job_output_result.jobs | length > 0

    - name: Check return code
      ansible.builtin.fail:
        msg: "Job failed with return code {{ job_output_result.jobs[0].ret_code.code }}"
      when:
        - job_output_result.jobs is defined
        - job_output_result.jobs | length > 0
        - job_output_result.jobs[0].ret_code.code is defined
        - job_output_result.jobs[0].ret_code.code | int > (max_rc | default(0) | int)

    - name: Summary
      ansible.builtin.debug:
        msg: "Job output retrieved successfully. Total DD names: {{ job_output_result.jobs[0].ddnames | length }}"
      when: 
        - job_output_result.jobs is defined
        - job_output_result.jobs | length > 0

