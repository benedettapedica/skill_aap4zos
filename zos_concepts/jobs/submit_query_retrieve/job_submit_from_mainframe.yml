---
- name: Copy, modify and submit JCL from mainframe library using zos_lineinfile
  hosts: zos_host
  gather_facts: false
  environment: "{{ environment_vars }}"
  
  tasks:
    - name: "Step 1: Copy JCL template from source to target library"
      ibm.ibm_zos_core.zos_copy:
        src: "{{ source_library | default('DEFUSER.JCL') }}({{ source_member | default('ADDUSER') }})"
        dest: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        remote_src: true
        force: true
      register: copy_template

    - name: "Confirm: JCL template copied (DEFUSER remains unchanged)"
      ansible.builtin.debug:
        msg:
          - "✓ JCL copied from {{ source_library | default('DEFUSER.JCL') }}({{ source_member | default('ADDUSER') }}) to {{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
          - "⚠️  Source library remains unchanged with original variables"
          - "⚠️  Target library currently has variables, will be updated with zos_lineinfile"

    - name: "Step 2: Replace XXXXXXXX with job_name in JCL header"
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        regexp: '^//XXXXXXXX '
        line: "//{{ job_name | default(userid) }} JOB (HWSW),'ADDUSER-{{ nome | upper }}',CLASS={{ job_class | default('X') }},MSGCLASS={{ msgclass | default('X') }},REGION=4M,"
        state: present
      register: replace_jobname

    - name: "Step 3: Replace $USERID with actual userid in ADDUSER command"
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        regexp: 'ADDUSER NEWUSER'
        line: "ADDUSER {{ userid }}  NAME('{{ nome }} {{ cognome }}')                    -"
        state: present
      register: replace_adduser

    - name: "Step 4: Replace $NOME $COGNOME in NAME field (if separate line)"
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        regexp: "NAME\\('\\$NOME \\$COGNOME"
        line: "ADDUSER {{ userid }}  NAME('{{ nome }} {{ cognome }}')                    -"
        state: present
      register: replace_name
      ignore_errors: true

    - name: "Step 5: Replace $CODICEFISCALE with actual codice_fiscale"
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        regexp: "DATA\\('\\$CODICEFISCALE"
        line: "DATA('{{ codice_fiscale }}')  DFLTGRP({{ gruppo }}) CICS(OPIDENT(007))   -"
        state: present
      register: replace_cf

    - name: "Step 6: Replace $GRP with actual gruppo"
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        regexp: "DFLTGRP\\(\\$GRP\\)"
        line: "DATA('{{ codice_fiscale }}')  DFLTGRP({{ gruppo }}) CICS(OPIDENT(007))   -"
        state: present
      register: replace_grp
      ignore_errors: true

    - name: "Step 7: Replace $PSW and $OWNER with actual password and owner"
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        regexp: "PASSWORD\\(\\$PSW\\)"
        line: "PASSWORD({{ password }}) OWNER({{ owner }})"
        state: present
      register: replace_pwd

    - name: "Step 8: Replace $XX/XX/XX with actual data_revoke in ALTUSER"
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        regexp: "ALTUSER NEWUSER REVOKE"
        line: "ALTUSER {{ userid }} REVOKE({{ data_revoke }})"
        state: present
      register: replace_revoke

    - name: "Confirm: All parameters replaced in target library"
      ansible.builtin.debug:
        msg:
          - "✓ Job name: XXXXXXXX → {{ job_name | default(userid) }}"
          - "✓ User ID: NEWUSER → {{ userid }}"
          - "✓ Name: $NOME $COGNOME → {{ nome }} {{ cognome }}"
          - "✓ Codice Fiscale: $CODICEFISCALE → {{ codice_fiscale }}"
          - "✓ Group: $GRP → {{ gruppo }}"
          - "✓ Password: $PSW → {{ password }}"
          - "✓ Owner: $OWNER → {{ owner }}"
          - "✓ Revoke Date: $XX/XX/XX → {{ data_revoke }}"
          - "✓ {{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }}) ready to submit"

    - name: "Step 9: Submit JCL from target library"
      ibm.ibm_zos_core.zos_job_submit:
        src: "{{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }})"
        location: DATA_SET
        wait_time_s: 60
      register: job_submit
      ignore_errors: true

    - name: Set fact with results from job submission
      ansible.builtin.set_fact:
        job_results: "{{ job_submit }}"

    - name: Set facts used in this playbook based on results
      ansible.builtin.set_fact:
        submit_job_name: "{{ job_results.jobs[0].job_name | default('N/A') }}"
        submit_job_id: "{{ job_results.jobs[0].job_id | default('N/A') }}"
        submit_jobs_ddnames_length: "{{ job_results.jobs[0].ddnames | length | default(0) }}"
        submit_job_ddnames_list: "{{ job_results.jobs[0].ddnames | default([]) }}"
        submit_job_list: "{{ job_results.jobs[0] | default({}) }}"
        submit_job_ret_code: "{{ job_results.jobs[0].ret_code.code | default('N/A') }}"
        submit_job_ret_code_msg: "{{ job_results.jobs[0].ret_code.msg | default('N/A') }}"
        submit_job_subsystem: "{{ job_results.jobs[0].subsystem | default('N/A') }}"

    - name: "Step 10: Display Job Submission Results"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "JCL Submission Results"
          - "=========================================="
          - "Source Template: {{ source_library | default('DEFUSER.JCL') }}({{ source_member | default('ADDUSER') }}) [UNCHANGED]"
          - "Target JCL: {{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }}) [UPDATED & SUBMITTED]"
          - "User Created: {{ userid }}"
          - "Job Name: {{ submit_job_name }}"
          - "Subsystem: {{ submit_job_subsystem }}"
          - "Job ID: {{ submit_job_id }}"
          - "DD Count: {{ submit_jobs_ddnames_length }}"
          - "Return Code: {{ submit_job_ret_code }}"
          - "Return Code Message: {{ submit_job_ret_code_msg }}"
          - "=========================================="

    - name: "Step 11: Get job output for job ID {{ submit_job_id }}"
      ibm.ibm_zos_core.zos_job_output:
        job_id: "{{ submit_job_id }}"
      register: job_output_result
      when: submit_job_id != 'N/A'

    - name: "Display: Job output for job ID {{ submit_job_id }}"
      ansible.builtin.debug:
        msg: "{{ job_output_result }}"
      when: submit_job_id != 'N/A'

    - name: "Final Summary"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Process Complete"
          - "=========================================="
          - "✓ {{ source_library | default('DEFUSER.JCL') }}({{ source_member | default('ADDUSER') }}) - Original template preserved"
          - "✓ {{ target_library | default('NEWUSER.JCL') }}({{ target_member | default('ADDUSER') }}) - Updated with user: {{ userid }}"
          - "✓ Job {{ submit_job_id }} submitted with RC: {{ submit_job_ret_code }}"
          - "✓ All parameters collected from user and applied successfully"
          - "=========================================="

