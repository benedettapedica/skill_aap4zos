---
- name: Copy, modify and submit JCL from mainframe library using zos_lineinfile
  hosts: zos_host
  gather_facts: false
  environment: "{{ environment_vars }}"
  
  tasks:
    - name: "Step 1: Copy JCL template from source to target library"
      ibm.ibm_zos_core.zos_copy:
        src: "{{ source_library | default('IBMUSER.JCL') }}({{ source_member | default('DEFUSER') }})"
        dest: "{{ target_library | default('IBMUSER.JCL') }}({{ target_member | default('NEWUSER') }})"
        remote_src: true
        force: true
      register: copy_template

    - name: "Confirm: JCL template copied (DEFUSER remains unchanged)"
      ansible.builtin.debug:
        msg:
          - "✓ JCL copied from {{ source_library | default('IBMUSER.JCL') }}({{ source_member | default('DEFUSER') }}) to {{ target_library | default('IBMUSER.JCL') }}({{ target_member | default('NEWUSER') }})"
          - "Source library remains unchanged with original variables"
          - "Target library currently has variables, will be updated with zos_lineinfile"

    - name: "Step 2: Read JCL content from target"
      ibm.ibm_zos_core.zos_fetch:
        src: "{{ target_library | default('IBMUSER.JCL') }}({{ target_member | default('NEWUSER') }})"
        dest: "/tmp/jcl_temp.txt"
        flat: true
      register: fetch_jcl

    - name: "Step 3: Replace all variables in JCL content"
      ansible.builtin.set_fact:
        modified_jcl: "{{ lookup('file', '/tmp/jcl_temp.txt') |
          replace('XXXXXXXX', job_name | default(userid)) |
          replace('$NEWUSER', userid) |
          replace('$NOME', nome) |
          replace('$COGNOME', cognome) |
          replace('$CODICEFISCALE', codice_fiscale) |
          replace('$GRP', gruppo) |
          replace('$PSW', password) |
          replace('$OWNER', owner) |
          replace('$XX/XX/XX', data_revoke) }}"

    - name: "Step 4: Write modified JCL back to target"
      ibm.ibm_zos_core.zos_copy:
        content: "{{ modified_jcl }}"
        dest: "{{ target_library | default('IBMUSER.JCL') }}({{ target_member | default('NEWUSER') }})"
        force: true
      register: write_jcl

    - name: "Step 5: Cleanup temporary file"
      ansible.builtin.file:
        path: "/tmp/jcl_temp.txt"
        state: absent

    - name: "Confirm: All parameters replaced in target library"
      ansible.builtin.debug:
        msg:
          - "✓ Job name: XXXXXXXX → {{ job_name | default(userid) }}"
          - "✓ User ID: $NEWUSER → {{ userid }}"
          - "✓ Nome: $NOME → {{ nome }}"
          - "✓ Cognome: $COGNOME → {{ cognome }}"
          - "✓ Codice Fiscale: $CODICEFISCALE → {{ codice_fiscale }}"
          - "✓ Group: $GRP → {{ gruppo }}"
          - "✓ Password: $PSW → [HIDDEN]"
          - "✓ Owner: $OWNER → {{ owner }}"
          - "✓ Revoke Date: $XX/XX/XX → {{ data_revoke }}"
          - "✓ {{ target_library | default('IBMUSER.JCL') }}({{ target_member | default('NEWUSER') }}) ready to submit"

    - name: "Step 11: Submit JCL from target library"
      ibm.ibm_zos_core.zos_job_submit:
        src: "{{ target_library | default('IBMUSER.JCL') }}({{ target_member | default('NEWUSER') }})"
        location: DATA_SET
        wait_time_s: 300
      register: job_submit
      ignore_errors: true

    - name: Set fact with results from job submission
      ansible.builtin.set_fact:
        job_results: "{{ job_submit }}"

    - name: Set facts used in this playbook based on results
      ansible.builtin.set_fact:
        submit_job_name: "{{ job_results.jobs[0].job_name | default('N/A') }}"
        submit_job_id: "{{ job_results.jobs[0].job_id | default('N/A') }}"
        submit_jobs_ddnames_length: "{{ job_results.jobs[0].ddnames | length | default(0) }}"
        submit_job_ddnames_list: "{{ job_results.jobs[0].ddnames | default([]) }}"
        submit_job_list: "{{ job_results.jobs[0] | default({}) }}"
        submit_job_ret_code: "{{ job_results.jobs[0].ret_code.code | default('N/A') }}"
        submit_job_ret_code_msg: "{{ job_results.jobs[0].ret_code.msg | default('N/A') }}"
        submit_job_subsystem: "{{ job_results.jobs[0].subsystem | default('N/A') }}"

    - name: "Step 10: Display Job Submission Results"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "JCL Submission Results"
          - "=========================================="
          - "Source Template: {{ source_library | default('IBMUSER.JCL') }}({{ source_member | default('DEFUSER') }}) [UNCHANGED]"
          - "Target JCL: {{ target_library | default('IBMUSER.JCL') }}({{ target_member | default('NEWUSER') }}) [UPDATED & SUBMITTED]"
          - "User Created: {{ userid }}"
          - "Job Name: {{ submit_job_name }}"
          - "Subsystem: {{ submit_job_subsystem }}"
          - "Job ID: {{ submit_job_id }}"
          - "DD Count: {{ submit_jobs_ddnames_length }}"
          - "Return Code: {{ submit_job_ret_code }}"
          - "Return Code Message: {{ submit_job_ret_code_msg }}"
          - "=========================================="

    - name: "Step 11: Get job output for job ID {{ submit_job_id }}"
      ibm.ibm_zos_core.zos_job_output:
        job_id: "{{ submit_job_id }}"
      register: job_output_result
      when: submit_job_id != 'N/A'

    - name: "Display: Job output for job ID {{ submit_job_id }}"
      ansible.builtin.debug:
        msg: "{{ job_output_result }}"
      when: submit_job_id != 'N/A'

    - name: "Final Summary"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Process Complete"
          - "=========================================="
          - "✓ {{ source_library | default('IBMUSER.JCL') }}({{ source_member | default('DEFUSER') }}) - Original template preserved"
          - "✓ {{ target_library | default('IBMUSER.JCL') }}({{ target_member | default('NEWUSER') }}) - Updated with user: {{ userid }}"
          - "✓ Job {{ submit_job_id }} submitted with RC: {{ submit_job_ret_code }}"
          - "✓ All parameters collected from user and applied successfully"
          - "=========================================="

