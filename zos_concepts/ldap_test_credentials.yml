---
- name: LDAP Credentials Test and Discovery
  hosts: localhost
  gather_facts: false
  
  vars:
    ldap_server: "{{ ldap_server | default('ldapsvil.gr-u.it') }}"
    ldap_port: "{{ ldap_port | default(389) }}"
    test_username: "{{ test_username | default('') }}"
    test_password: "{{ test_password | default('') }}"
    test_bind_dn: "{{ test_bind_dn | default('') }}"
    base_search_dn: "{{ base_search_dn | default('dc=gr-u,dc=it') }}"

  tasks:
    - name: "=========================================="
      debug:
        msg:
          - "LDAP CREDENTIALS TEST"
          - "=========================================="
          - "Server: {{ ldap_server }}:{{ ldap_port }}"
          - "Username: {{ test_username if test_username != '' else 'Not provided' }}"
          - "Bind DN: {{ test_bind_dn if test_bind_dn != '' else 'Will be discovered' }}"
          - "=========================================="

    # TEST 1: Connettività Server
    - name: "TEST 1: Check LDAP server connectivity"
      shell: |
        timeout 5 bash -c "echo > /dev/tcp/{{ ldap_server }}/{{ ldap_port }}" 2>/dev/null && echo "SUCCESS" || echo "FAILED"
      register: connectivity_test
      ignore_errors: true
      changed_when: false

    - name: "TEST 1 Result: Server Connectivity"
      debug:
        msg: |
          ==========================================
          TEST 1: Server Connectivity
          ==========================================
          Server: {{ ldap_server }}:{{ ldap_port }}
          Status: {{ 'REACHABLE ✅' if 'SUCCESS' in connectivity_test.stdout else 'UNREACHABLE ❌' }}
          ==========================================

    # TEST 2: Ricerca Anonima (per scoprire struttura)
    - name: "TEST 2: Try anonymous search to discover structure"
      shell: |
        ldapsearch -x -H ldap://{{ ldap_server }}:{{ ldap_port }} \
          -b "{{ base_search_dn }}" \
          -s base \
          "(objectClass=*)" \
          dn 2>&1
      register: anonymous_search
      ignore_errors: true
      changed_when: false
      when: connectivity_test.stdout is search('SUCCESS')

    - name: "TEST 2 Result: Anonymous Search"
      debug:
        msg: |
          ==========================================
          TEST 2: Anonymous Search
          ==========================================
          {% if anonymous_search.rc == 0 %}
          Status: ALLOWED ✅
          Base DN exists: {{ base_search_dn }}
          {% else %}
          Status: NOT ALLOWED ⚠️
          (This is normal - most LDAP servers require authentication)
          {% endif %}
          ==========================================
      when: connectivity_test.stdout is search('SUCCESS')

    # TEST 3: Trova DN dell'utente (se fornito username)
    - name: "TEST 3: Search for user DN by username"
      shell: |
        ldapsearch -x -H ldap://{{ ldap_server }}:{{ ldap_port }} \
          -b "{{ base_search_dn }}" \
          -s sub \
          "(|(uid={{ test_username }})(cn={{ test_username }})(sAMAccountName={{ test_username }}))" \
          dn 2>&1 | grep "^dn:" | head -1
      register: user_dn_search
      ignore_errors: true
      changed_when: false
      when: 
        - connectivity_test.stdout is search('SUCCESS')
        - test_username != ''
        - test_bind_dn == ''

    - name: "TEST 3 Result: User DN Discovery"
      debug:
        msg: |
          ==========================================
          TEST 3: User DN Discovery
          ==========================================
          Username searched: {{ test_username }}
          {% if user_dn_search.rc == 0 and user_dn_search.stdout != '' %}
          Found DN: {{ user_dn_search.stdout | regex_replace('^dn: ', '') }} ✅
          {% else %}
          Status: DN not found or anonymous search not allowed ⚠️
          You need to provide the full DN manually.
          {% endif %}
          ==========================================
      when: 
        - connectivity_test.stdout is search('SUCCESS')
        - test_username != ''
        - test_bind_dn == ''

    - name: Set discovered DN
      set_fact:
        discovered_dn: "{{ user_dn_search.stdout | regex_replace('^dn: ', '') }}"
      when:
        - user_dn_search is defined
        - user_dn_search.rc == 0
        - user_dn_search.stdout != ''

    - name: Set bind DN for authentication test
      set_fact:
        bind_dn_to_test: "{{ test_bind_dn if test_bind_dn != '' else (discovered_dn if discovered_dn is defined else '') }}"

    # TEST 4: Autenticazione con credenziali
    - name: "TEST 4: Test authentication with credentials"
      shell: |
        ldapwhoami -x -H ldap://{{ ldap_server }}:{{ ldap_port }} \
          -D "{{ bind_dn_to_test }}" \
          -w "{{ test_password }}" 2>&1
      register: auth_test
      ignore_errors: true
      changed_when: false
      no_log: true
      when:
        - connectivity_test.stdout is search('SUCCESS')
        - bind_dn_to_test is defined
        - bind_dn_to_test != ''
        - test_password != ''

    - name: "TEST 4 Result: Authentication"
      debug:
        msg: |
          ==========================================
          TEST 4: Authentication Test
          ==========================================
          Bind DN: {{ bind_dn_to_test }}
          {% if auth_test.rc == 0 %}
          Status: AUTHENTICATION SUCCESSFUL ✅
          Identity: {{ auth_test.stdout }}
          {% else %}
          Status: AUTHENTICATION FAILED ❌
          Error: {{ auth_test.stderr | default('Invalid credentials or DN') }}
          {% endif %}
          ==========================================
      when:
        - auth_test is defined
        - auth_test.skipped is not defined

    # TEST 5: Verifica permessi di lettura
    - name: "TEST 5: Test read permissions"
      shell: |
        ldapsearch -x -H ldap://{{ ldap_server }}:{{ ldap_port }} \
          -D "{{ bind_dn_to_test }}" \
          -w "{{ test_password }}" \
          -b "{{ base_search_dn }}" \
          -s one \
          "(objectClass=*)" \
          dn 2>&1 | head -20
      register: read_test
      ignore_errors: true
      changed_when: false
      no_log: true
      when:
        - auth_test is defined
        - auth_test.rc == 0

    - name: "TEST 5 Result: Read Permissions"
      debug:
        msg: |
          ==========================================
          TEST 5: Read Permissions
          ==========================================
          {% if read_test.rc == 0 %}
          Status: READ ACCESS GRANTED ✅
          Found entries in: {{ base_search_dn }}
          
          Sample entries:
          {{ read_test.stdout }}
          {% else %}
          Status: READ ACCESS DENIED ❌
          Error: {{ read_test.stderr | default('Insufficient permissions') }}
          {% endif %}
          ==========================================
      when:
        - read_test is defined
        - read_test.skipped is not defined

    # TEST 6: Verifica struttura LDAP
    - name: "TEST 6: Discover LDAP structure"
      shell: |
        ldapsearch -x -H ldap://{{ ldap_server }}:{{ ldap_port }} \
          -D "{{ bind_dn_to_test }}" \
          -w "{{ test_password }}" \
          -b "{{ base_search_dn }}" \
          -s one \
          "(objectClass=organizationalUnit)" \
          ou 2>&1 | grep "^ou:" | head -10
      register: structure_test
      ignore_errors: true
      changed_when: false
      no_log: true
      when:
        - auth_test is defined
        - auth_test.rc == 0

    - name: "TEST 6 Result: LDAP Structure"
      debug:
        msg: |
          ==========================================
          TEST 6: LDAP Structure Discovery
          ==========================================
          Base DN: {{ base_search_dn }}
          
          {% if structure_test.rc == 0 and structure_test.stdout != '' %}
          Found organizational units:
          {{ structure_test.stdout }}
          {% else %}
          No organizational units found or insufficient permissions
          {% endif %}
          ==========================================
      when:
        - structure_test is defined
        - structure_test.skipped is not defined

    # FINAL SUMMARY
    - name: "=========================================="
      debug:
        msg: |
          ==========================================
          FINAL SUMMARY
          ==========================================
          Server: {{ ldap_server }}:{{ ldap_port }}
          
          {% if bind_dn_to_test is defined and bind_dn_to_test != '' %}
          Your DN: {{ bind_dn_to_test }}
          {% endif %}
          
          Test Results:
          {% if connectivity_test.stdout is search('SUCCESS') %}
          ✅ Server connectivity: OK
          {% else %}
          ❌ Server connectivity: FAILED
          {% endif %}
          
          {% if auth_test is defined and auth_test.rc == 0 %}
          ✅ Authentication: OK
          {% elif auth_test is defined %}
          ❌ Authentication: FAILED
          {% else %}
          ⚠️ Authentication: NOT TESTED (missing credentials)
          {% endif %}
          
          {% if read_test is defined and read_test.rc == 0 %}
          ✅ Read permissions: OK
          {% elif read_test is defined %}
          ❌ Read permissions: DENIED
          {% else %}
          ⚠️ Read permissions: NOT TESTED
          {% endif %}
          
          ==========================================
          NEXT STEPS:
          ==========================================
          {% if auth_test is defined and auth_test.rc == 0 %}
          ✅ You can use these credentials for LDAP operations!
          
          Use this in ldap_operations.yml:
          {
            "ldap_server": "{{ ldap_server }}",
            "ldap_port": {{ ldap_port }},
            "ldap_bind_dn": "{{ bind_dn_to_test }}",
            "ldap_bind_password": "YOUR_PASSWORD"
          }
          {% else %}
          ⚠️ Authentication failed or not tested.
          
          Please provide:
          - test_username: your LDAP username
          - test_password: your LDAP password
          OR
          - test_bind_dn: your full LDAP DN
          - test_password: your LDAP password
          
          For admin operations (create groups, reset passwords),
          you need an LDAP admin account.
          {% endif %}
          ==========================================

    - name: Save test results to file
      copy:
        content: |
          LDAP Credentials Test Results
          ==============================
          Server: {{ ldap_server }}:{{ ldap_port }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          
          {% if bind_dn_to_test is defined %}
          Tested DN: {{ bind_dn_to_test }}
          {% endif %}
          
          Connectivity: {{ 'OK' if connectivity_test.stdout is search('SUCCESS') else 'FAILED' }}
          Authentication: {{ 'OK' if (auth_test is defined and auth_test.rc == 0) else 'FAILED' }}
          Read Access: {{ 'OK' if (read_test is defined and read_test.rc == 0) else 'FAILED' }}
          
          {% if structure_test is defined and structure_test.stdout != '' %}
          LDAP Structure:
          {{ structure_test.stdout }}
          {% endif %}
        dest: "/tmp/ldap_test_{{ ldap_server }}_{{ lookup('pipe', 'date +%s') }}.txt"
      delegate_to: localhost

